# Strict alignment run for step-1 comparison.
cluster:
  num_nodes: 1
  component_placement:
    actor: 0-7
    env: 0-7
    rollout: 0-7

runner:
  task_type: embodied
  logger:
    log_path: ./results
    project_name: joyrlinf
    experiment_name: libero_grpo_gr00t_spatial_sync_strict_align_step1
    logger_backends: [tensorboard]
  max_epochs: 1000
  max_steps: 1
  val_check_interval: -1
  save_interval: 25
  resume_dir: null

algorithm:
  pipeline_mode: sync
  comm_mode: v2
  normalize_advantages: True
  group_size: 8
  reward_coef: 1.0
  rollout_epoch: 1
  update_epoch: 1
  adv_type: grpo
  loss_type: actor
  loss_agg_func: "token-mean"
  kl_beta: 0.0
  entropy_bonus: 0.005
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0
  gamma: 0.99
  gae_lambda: 0.95
  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: chunk_level
  filter_rewards: True
  rewards_lower_bound: 0.0
  rewards_upper_bound: 5.0

memory:
  pytorch_fraction: 0.0
  env_reserved_mib: 0
  safety_margin_mib: 8192
  critical_margin_mib: 2048
  gc_threshold: 0.8
  max_split_size_mb: 128
  expandable_segments: true

env:
  train:
    env_type: libero
    task_suite_name: libero_spatial
    total_num_envs: 512
    group_size: 8
    auto_reset: True
    use_fixed_reset_state_ids: True
    use_ordered_reset_state_ids: True
    max_episode_steps: 240
    max_steps_per_rollout_epoch: 240
    use_rel_reward: True
    reward_coef: 5.0
    reset_gripper_open: True
    seed: 0
    init_params:
      camera_heights: 256
      camera_widths: 256

actor:
  enable_offload: False
  micro_batch_size: 32
  gradient_accumulation_steps: 1
  seed: 1234
  model:
    model_path: /ufs_500T/model/RLinf-Gr00t-SFT-Spatial
    model_type: gr00t
    num_action_chunks: 5
    action_dim: 7
    num_steps: 4
    add_value_head: False
    predict_micro_batch_size: 32
    policy_setup: libero
    gr00t:
      embodiment_tag: libero_franka
      obs_converter_type: libero
      denoising_steps: 4
      precision: bf16
      tune_visual: false
      tune_llm: false
      rl_head_config:
        joint_logprob: true
        noise_method: flow_sde
        ignore_last: false
        safe_get_logprob: false
        noise_anneal: false
        noise_params: [0.7, 0.3, 400]
        noise_level: 0.5
        add_value_head: false
        chunk_critic_input: false
        detach_critic_input: true
        disable_dropout: true
        use_vlm_value: false
        value_vlm_mode: mean_token
        padding_value: 570
  optim:
    lr: 5.0e-6
    value_lr: 1.0e-4
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    clip_grad: 1.0
    weight_decay: 0.01
    align_grad_dtype_for_optimizer: false
  fsdp_config:
    strategy: fsdp
    sharding_strategy: no_shard
    gradient_checkpointing: False
    mixed_precision:
      param_dtype: bf16
      reduce_dtype: bf16
      buffer_dtype: bf16
      keep_low_precision_grads: false
    amp_autocast:
      enabled: false
      precision: bf16
