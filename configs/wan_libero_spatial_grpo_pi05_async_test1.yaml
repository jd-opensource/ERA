cluster:
  num_nodes: 1
  component_placement:
    actor: 6-7
    env: 0-5
    rollout: 0-5
runner:
  task_type: embodied
  logger:
    log_path: ./results
    project_name: joyrlinf
    experiment_name: libero_grpo_pi05_async_world_model
    logger_backends:
    - tensorboard
  max_steps: 1000
  val_check_interval: 1
  save_interval: 120
algorithm:
  pipeline_mode: async
  comm_mode: v2
  group_size: 6
  rollout_epoch: 1
  update_epoch: 1
  adv_type: grpo
  loss_type: actor
  entropy_bonus: 0.005
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  reward_type: chunk_level
  logprob_type: chunk_level
  filter_rewards: true
  rewards_lower_bound: 0.0
  rewards_upper_bound: 1.0
memory:
  pytorch_fraction: 0.0
  safety_margin_mib: 8192
  critical_margin_mib: 2048
  gc_threshold: 0.8
  max_split_size_mb: 128
  expandable_segments: true
env:
  train:
    env_type: wan_wm
    env_ft_type: libero
    total_num_envs: 72
    group_size: ${algorithm.group_size}
    max_episode_steps: 256
    auto_reset: false
    ignore_terminations: false
    use_fixed_reset_state_ids: true
    max_steps_per_rollout_epoch: 256
    use_rel_reward: true
    num_inference_steps: 5
    infer_micro_batch_size: 0
    chunk: 8
    condition_frame_length: 5
    num_frames: 13
    image_size:
    - 256
    - 256
    seed: 0
    initial_image_path: /ufs_500T/model/world_models/RLinf-Wan-LIBERO-Spatial/dataset
    wan_wm_hf_ckpt_path: /ufs_500T/model/world_models/RLinf-Wan-LIBERO-Spatial
    VAE_path: /ufs_500T/model/world_models/RLinf-Wan-LIBERO-Spatial/Wan2.2_VAE.pth
    model_path: /ufs_500T/model/world_models/RLinf-Wan-LIBERO-Spatial/model-00001.safetensors
    reward_model:
      type: ResnetRewModel
      from_pretrained: /ufs_500T/model/world_models/RLinf-Wan-LIBERO-Spatial/resnet_rm.pth
    reward_coef: 5.0
    reset_gripper_open: true
    enable_offload: false
    video_cfg:
      save_video: true
      video_base_dir: ${runner.logger.log_path}/video/eval
  eval:
    total_num_envs: 72
    group_size: 1
    max_episode_steps: 512
    auto_reset: false
    ignore_terminations: true
    use_fixed_reset_state_ids: true
    max_steps_per_rollout_epoch: 512
    use_rel_reward: true
    num_inference_steps: 5
    infer_micro_batch_size: 0
    chunk: 8
    condition_frame_length: 5
    num_frames: 13
    image_size:
    - 256
    - 256
    seed: 0
    is_eval: true
    enable_kir: false
    initial_image_path: /ufs_500T/model/world_models/RLinf-Wan-LIBERO-Spatial/dataset
    wan_wm_hf_ckpt_path: /ufs_500T/model/world_models/RLinf-Wan-LIBERO-Spatial
    VAE_path: /ufs_500T/model/world_models/RLinf-Wan-LIBERO-Spatial/Wan2.2_VAE.pth
    model_path: /ufs_500T/model/world_models/RLinf-Wan-LIBERO-Spatial/model-00001.safetensors
    reward_model:
      type: ResnetRewModel
      from_pretrained: /ufs_500T/model/world_models/RLinf-Wan-LIBERO-Spatial/resnet_rm.pth
    reward_coef: 1.0
    reset_gripper_open: true
    enbale_offload: false
    video_cfg:
      save_video: false
      video_base_dir: ${runner.logger.log_path}/video/eval
actor:
  enable_offload: false
  micro_batch_size: 128
  model:
    model_path: /ufs_500T/model/RLinf-Pi05-LIBERO-SFT/
    model_type: openpi
    num_action_chunks: 8
    action_dim: 7
    num_steps: 4
    add_value_head: false
    predict_micro_batch_size: 64
    openpi:
      config_name: pi05_libero_wan
      num_images_in_input: 1
      noise_method: flow_noise
      action_horizon: 8
      noise_params:
      - 0.16
      - 0.12
      - 200
      joint_logprob: true
      train_expert_only: true
    policy_setup: widowx_bridge
  optim:
    lr: 7.91e-06
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    clip_grad: 1.0
  fsdp_config:
    sharding_strategy: no_shard
    mixed_precision:
      param_dtype: null
      reduce_dtype: null
      buffer_dtype: null
  gradient_accumulation_steps: 4
