cluster:
  num_nodes: 1
  component_placement:
    actor: 4-7
    env: 0-1
    rollout: 2-3
runner:
  task_type: embodied
  logger:
    log_path: ./results
    project_name: joyrlinf
    experiment_name: maniskill_grpo_pi05_disagg
    logger_backends:
    - tensorboard
  max_steps: 6
  val_check_interval: -1
  save_interval: 50
  resume_dir: null
algorithm:
  pipeline_mode: async
  comm_mode: v1
  group_size: 8
  rollout_epoch: 1
  update_epoch: 1
  adv_type: grpo
  loss_type: actor
  entropy_bonus: 0.005
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  reward_type: chunk_level
  logprob_type: chunk_level
  filter_rewards: true
  rewards_lower_bound: 0.0
  rewards_upper_bound: 1.0
memory:
  pytorch_fraction: 0.0
  safety_margin_mib: 8192
  critical_margin_mib: 2048
  gc_threshold: 0.8
  max_split_size_mb: 128
  expandable_segments: true
env:
  train:
    env_type: maniskill
    total_num_envs: 256
    group_size: 8
    auto_reset: false
    use_fixed_reset_state_ids: false
    max_episode_steps: 80
    max_steps_per_rollout_epoch: 80
    use_rel_reward: true
    seed: 0
    init_params:
      id: PutOnPlateInScene25Main-v3
      obs_mode: rgb+segmentation
      control_mode: arm_pd_ee_target_delta_pose_align2_gripper_pd_joint_pos
      sim_backend: gpu
      sim_config:
        sim_freq: 500
        control_freq: 5
        gpu_memory_config:
          found_lost_pairs_capacity: 268435456
          found_lost_aggregate_pairs_capacity: 8192
          total_aggregate_pairs_capacity: 8192
          max_rigid_contact_count: 4194304
          max_rigid_patch_count: 2097152
          heap_capacity: 536870912
          temp_buffer_capacity: 134217728
          collision_stack_size: 33554432
      sensor_configs:
        shader_pack: default
      render_mode: all
      obj_set: train
      use_multiple_plates: false
actor:
  enable_offload: false
  micro_batch_size: 64
  model:
    model_path: /ufs_500T/model/colm_paper_model_test/RLinf-Pi05-ManiSkill-25Main-SFT/
    model_type: openpi
    num_action_chunks: 5
    action_dim: 7
    num_steps: 4
    add_value_head: false
    predict_micro_batch_size: 64
    openpi:
      config_name: pi05_maniskill
      num_images_in_input: 1
      noise_method: flow_noise
      action_horizon: 8
      noise_params:
      - 0.16
      - 0.12
      - 200
      joint_logprob: true
      train_expert_only: true
    policy_setup: widowx_bridge
  optim:
    lr: 7.91e-06
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    clip_grad: 1.0
  fsdp_config:
    sharding_strategy: no_shard
    mixed_precision:
      param_dtype: null
      reduce_dtype: null
      buffer_dtype: null
  gradient_accumulation_steps: 1
