cluster:
  num_nodes: 1
  component_placement:
    actor: 6-7
    env: 0-5
    rollout: 0-5
runner:
  task_type: embodied
  logger:
    log_path: ./results
    project_name: joyrlinf
    experiment_name: maniskill_ppo_openvla_oft_async
    logger_backends:
    - tensorboard
  max_steps: 1000
  val_check_interval: -1
  save_interval: 40
  resume_dir: null
algorithm:
  pipeline_mode: async
  comm_mode: v2
  normalize_advantages: true
  group_size: 1
  rollout_epoch: 1
  update_epoch: 1
  adv_type: gae
  loss_type: decoupled_actor_critic
  entropy_bonus: 0.0
  clip_ratio_high: 0.28
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0
  gamma: 0.99
  gae_lambda: 0.95
  reward_type: action_level
  logprob_type: token_level
  staleness_threshold: 1
  stale_hard_drop_threshold: 3
  behave_weight_threshold: 2
  filter_rewards: false
  rewards_lower_bound: 0.0
  rewards_upper_bound: 1.0
memory:
  pytorch_fraction: 0.0
  safety_margin_mib: 8192
  critical_margin_mib: 2048
  gc_threshold: 0.8
  max_split_size_mb: 128
  expandable_segments: true
env:
  train:
    env_type: maniskill
    total_num_envs: 384
    group_size: 1
    auto_reset: true
    use_fixed_reset_state_ids: false
    max_episode_steps: 80
    max_steps_per_rollout_epoch: 160
    use_rel_reward: true
    seed: 0
    init_params:
      id: PutOnPlateInScene25Main-v3
      obs_mode: rgb+segmentation
      control_mode: arm_pd_ee_target_delta_pose_align2_gripper_pd_joint_pos
      sim_backend: gpu
      sim_config:
        sim_freq: 500
        control_freq: 5
        gpu_memory_config:
          found_lost_pairs_capacity: 268435456
          found_lost_aggregate_pairs_capacity: 8192
          total_aggregate_pairs_capacity: 8192
          max_rigid_contact_count: 4194304
          max_rigid_patch_count: 2097152
          heap_capacity: 536870912
          temp_buffer_capacity: 134217728
          collision_stack_size: 33554432
      sensor_configs:
        shader_pack: default
      render_mode: all
      obj_set: train
      use_multiple_plates: false
  eval:
    total_num_envs: 16
    group_size: 1
    auto_reset: false
    use_fixed_reset_state_ids: true
    max_episode_steps: 80
    max_steps_per_rollout_epoch: 80
    use_rel_reward: true
    seed: 0
    init_params:
      id: PutOnPlateInScene25Main-v3
      obs_mode: rgb+segmentation
      control_mode: arm_pd_ee_target_delta_pose_align2_gripper_pd_joint_pos
      sim_backend: gpu
      sim_config:
        sim_freq: 500
        control_freq: 5
        gpu_memory_config:
          found_lost_pairs_capacity: 268435456
          found_lost_aggregate_pairs_capacity: 8192
          total_aggregate_pairs_capacity: 8192
          max_rigid_contact_count: 4194304
          max_rigid_patch_count: 2097152
          heap_capacity: 536870912
          temp_buffer_capacity: 134217728
          collision_stack_size: 33554432
      sensor_configs:
        shader_pack: default
      render_mode: all
      obj_set: test
      use_multiple_plates: false
actor:
  enable_offload: false
  micro_batch_size: 40
  model:
    model_path: /ufs_500T/wlq/models/openvla-oft/
    model_type: openvla_oft
    lora_path: /ufs_500T/wlq/models/RLinf-OpenVLAOFT-ManiSkill-Base-Lora/
    num_action_chunks: 8
    action_dim: 7
    unnorm_key: m3s400oft
    max_prompt_length: 30
    merge_lora: false
    policy_setup: widowx_bridge
    add_value_head: true
    value_output_dim: ${actor.model.num_action_chunks}
  optim:
    lr: 0.0001
    value_lr: 0.003
    adam_beta1: 0.9
    adam_beta2: 0.999
    adam_eps: 1.0e-08
    weight_decay: 0.01
    clip_grad: 10.0
  fsdp_config:
    sharding_strategy: no_shard
    use_orig_params: true
    mixed_precision:
      param_dtype: bfloat16
      reduce_dtype: bfloat16
      buffer_dtype: bfloat16
  gradient_accumulation_steps: 8
