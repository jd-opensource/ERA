cluster:
  num_nodes: 1
  component_placement:
    actor: 8-15
    env: 0-7
    rollout: 0-7

# train_async_mps.py expands each of the 8 torchrun workers into two ranks:
# EnvRollout 0-7 and Actor 8-15, paired on the same physical GPU.  Both MPS
# clients retain a 100% thread ceiling so idle Env SM capacity is available to
# Actor; lower either value only when a hard per-client SM cap is desired.
mps:
  manage_daemon: true
  env_rollout_active_thread_percentage: 100
  actor_active_thread_percentage: 100

runner:
  task_type: embodied
  logger:
    log_path: ./results
    project_name: joyrlinf
    experiment_name: maniskill_grpo_pi05_async_mps
    logger_backends: [tensorboard]
  max_epochs: 200
  max_steps: 10
  val_check_interval: -1
  save_interval: -1
  resume_dir: null

# EnvRollout and Actor are persistent, independent MPS clients on every GPU.
# Rollout N+1 overlaps Actor training N; policy weights may be one step stale.

algorithm:
  pipeline_mode: async
  # Same-GPU NCCL between two processes is unsupported.  The MPS runner uses
  # paired CPU/Gloo batch transfer while Actor FSDP remains 8-GPU NCCL.
  comm_mode: mps
  normalize_advantages: True
  group_size: 8
  reward_coef: 1.0
  rollout_epoch: 1
  update_epoch: 1
  adv_type: grpo
  loss_type: actor
  loss_agg_func: "token-mean"
  kl_beta: 0.0
  entropy_bonus: 0.005
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0
  gamma: 0.99
  gae_lambda: 0.95
  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: chunk_level
  filter_rewards: True
  rewards_lower_bound: 0.0
  rewards_upper_bound: 1.0

memory:
  pytorch_fraction: 0.0
  env_reserved_mib: 0
  safety_margin_mib: 8192
  critical_margin_mib: 2048
  gc_threshold: 0.8
  max_split_size_mb: 128
  expandable_segments: true

env:
  train:
    env_type: maniskill
    total_num_envs: 128
    group_size: 8
    auto_reset: False
    use_fixed_reset_state_ids: False
    max_episode_steps: 80
    max_steps_per_rollout_epoch: 80
    render_obs_only_at_chunk_end: True
    use_rel_reward: True
    seed: 0
    init_params:
      id: PutOnPlateInScene25Main-v3
      obs_mode: rgb+segmentation
      control_mode: arm_pd_ee_target_delta_pose_align2_gripper_pd_joint_pos
      sim_backend: gpu
      sim_config:
        sim_freq: 500
        control_freq: 5
        gpu_memory_config:
          found_lost_pairs_capacity: 268435456
          found_lost_aggregate_pairs_capacity: 8192
          total_aggregate_pairs_capacity: 8192
          max_rigid_contact_count: 4194304
          max_rigid_patch_count: 2097152
          heap_capacity: 536870912
          temp_buffer_capacity: 134217728
          collision_stack_size: 33554432
      sensor_configs:
        shader_pack: default
      render_mode: all
      obj_set: train
      use_multiple_plates: False

  eval:
    total_num_envs: 256
    group_size: 8
    auto_reset: False
    use_fixed_reset_state_ids: True
    max_episode_steps: 80
    max_steps_per_rollout_epoch: 80
    use_rel_reward: True
    seed: 0
    init_params:
      id: PutOnPlateInScene25Main-v3
      obs_mode: rgb+segmentation
      control_mode: arm_pd_ee_target_delta_pose_align2_gripper_pd_joint_pos
      sim_backend: gpu
      sim_config:
        sim_freq: 500
        control_freq: 5
        gpu_memory_config:
          found_lost_pairs_capacity: 268435456
          found_lost_aggregate_pairs_capacity: 8192
          total_aggregate_pairs_capacity: 8192
          max_rigid_contact_count: 4194304
          max_rigid_patch_count: 2097152
          heap_capacity: 536870912
          temp_buffer_capacity: 134217728
          collision_stack_size: 33554432
      sensor_configs:
        shader_pack: default
      render_mode: all
      obj_set: test
      use_multiple_plates: False

actor:
  enable_offload: False
  # 8 Actor ranks: per_actor = 32; MBS 16 gives 2 gradient-accumulation steps.
  micro_batch_size: 8
  global_batch_size: 256
  seed: 0
  model:
    model_path: /ufs_500T/model/colm_paper_model_test/RLinf-Pi05-ManiSkill-25Main-SFT/
    model_type: openpi
    num_action_chunks: 5
    action_dim: 7
    num_steps: 4
    add_value_head: False
    predict_micro_batch_size: 32
    openpi:
      config_name: pi05_maniskill
      num_images_in_input: 1
      noise_method: flow_noise
      action_horizon: 8
      use_gpu_input_transform: true
      use_gpu_output_transform: true
      cache_tokenized_prompt: true
      noise_params: [0.16, 0.12, 200]
      joint_logprob: True
      train_expert_only: True
      # S1 memory opts (defaults keep current behavior until GPU validation):
      # enable together after free-GPU smoke: reuse + expert_only_actor.
      reuse_rollout_prefix_kv: false
      expert_only_actor: false
      # Phase2: per-chunk async D2H of prefix_kv into a reused pinned host pool
      # (overlaps with env.chunk_step). Safe with reuse=false (no-op on KV).
      rollout_buffer_d2h: per_chunk
      # Later phases:
      # prefix_kv_transfer: microbatch | bulk_gpu
      # microbatch_prefetch: false  # keep false on colocated async
      prefix_kv_transfer: microbatch
      microbatch_prefetch: false
    policy_setup: widowx_bridge
  optim:
    lr: 7.91e-6
    value_lr: 1.55e-4
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    clip_grad: 1.0
  fsdp_config:
    strategy: fsdp
    sharding_strategy: no_shard
    gradient_checkpointing: False
    mixed_precision:
      param_dtype: null
      reduce_dtype: null
      buffer_dtype: null
